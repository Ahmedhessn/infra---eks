## PR plan → sticky comment OR manual run (workflow_dispatch) → Job summary + artifacts.
## Requires: OIDC role + per-env state buckets already created (bootstrap apply).
name: Terraform PR plan

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "live/**"
      - "modules/**"
      - ".github/workflows/terraform-pr.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: terraform-plan-${{ github.repository.id }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: unified
            workdir: live/unified/k8s
            state_key: unified/k8s/terraform.tfstate
          - env: dev
            workdir: live/dev/k8s
            state_key: dev/k8s/terraform.tfstate
          - env: staging
            workdir: live/staging/k8s
            state_key: staging/k8s/terraform.tfstate
          - env: prod
            workdir: live/prod/k8s
            state_key: prod/k8s/terraform.tfstate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve AWS region
        id: awsregion
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: echo "value=${AWS_REGION:-us-east-1}" >> "$GITHUB_OUTPUT"

      - name: Project prefix
        id: pp
        env:
          TF_PROJECT_PREFIX: ${{ vars.TF_PROJECT_PREFIX }}
        run: |
          PREFIX="${TF_PROJECT_PREFIX:-k8s-emad-128768042813}"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ steps.awsregion.outputs.value }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Write backend config (CI)
        working-directory: ${{ matrix.workdir }}
        run: |
          PREFIX="${{ steps.pp.outputs.prefix }}"
          ENV="${{ matrix.env }}"
          REGION="${{ steps.awsregion.outputs.value }}"
          cat > backend.ci.hcl <<EOF
          bucket         = "${PREFIX}-${ENV}-tf-state"
          key            = "${{ matrix.state_key }}"
          region         = "${REGION}"
          dynamodb_table = "${PREFIX}-${ENV}-tf-locks"
          encrypt        = true
          EOF

      - name: Terraform init
        id: init
        working-directory: ${{ matrix.workdir }}
        run: terraform init -backend-config=backend.ci.hcl -input=false
        continue-on-error: true

      - name: Terraform plan
        id: plan
        if: steps.init.outcome == 'success'
        working-directory: ${{ matrix.workdir }}
        run: terraform plan -no-color -input=false -lock=false -out=tfplan
        continue-on-error: true

      - name: Build comment / summary body
        if: always()
        working-directory: ${{ matrix.workdir }}
        env:
          INIT_OUTCOME: ${{ steps.init.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        run: |
          FILE="${{ runner.temp }}/comment-${{ matrix.env }}.md"
          {
            echo "### Terraform plan — \`${{ matrix.env }}\`"
            echo ""
            echo "**Stack:** \`${{ matrix.workdir }}\` · **init:** ${INIT_OUTCOME} · **plan:** ${PLAN_OUTCOME}"
            echo ""
            echo "<details><summary>Expand plan</summary>"
            echo ""
            echo '```hcl'
            if [ -f tfplan ]; then
              terraform show -no-color tfplan | head -c 62000
            else
              echo "(no plan file — fix init/plan in Actions log)"
            fi
            echo '```'
            echo ""
            echo "</details>"
          } > "$FILE"

      - name: Post sticky PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-plan-${{ matrix.env }}
          path: ${{ runner.temp }}/comment-${{ matrix.env }}.md
          number: ${{ github.event.pull_request.number }}

      - name: Job summary (manual run)
        if: always() && github.event_name == 'workflow_dispatch'
        run: cat "${{ runner.temp }}/comment-${{ matrix.env }}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan snippet (manual run)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.env }}
          path: ${{ runner.temp }}/comment-${{ matrix.env }}.md
          if-no-files-found: warn
